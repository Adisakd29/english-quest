<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#F6F7FB" />
<title>ออฟไลน์ — EnglishQuest</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F6F7FB; color: #1F2340;
    font-family: 'Noto Sans Thai', system-ui, sans-serif; font-size: 17px; line-height: 1.7; padding: 24px; box-sizing: border-box; }
  main { max-width: 420px; text-align: center; background: #fff; border: 1px solid #E3E6F0; border-radius: 22px; padding: 32px 24px; }
  h1 { font-size: 1.5rem; margin: 12px 0 8px; }
  p { color: #575C7A; margin: 0 0 20px; }
  button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 16px; background: #4F46E5; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
  button:focus-visible { outline: 3px solid #4F46E5; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 320 240" width="220" height="165" aria-hidden="true" style="display:block;margin:0 auto"><use href="/assets/illustrations/illustrations.svg#il-offline"></use></svg>
  <h1>ไม่ได้เชื่อมต่ออินเทอร์เน็ต</h1>
  <p>ตรวจสอบการเชื่อมต่อแล้วลองอีกครั้ง — ความก้าวหน้าของคุณถูกบันทึกไว้ที่เซิร์ฟเวอร์แล้ว</p>
  <button type="button" onclick="location.reload()">ลองอีกครั้ง</button>
</main>
</body>
</html>
